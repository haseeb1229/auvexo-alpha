[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "auvexo-alpha"
version = "0.1.0"
description = "Private local research foundation with execution disabled"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.2",
  "pydantic==2.14.1",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "polars==2.0.0",
  "psutil==7.2.2",
]

[project.scripts]
auvexo = "auvexo_alpha.cli:main"
auvexo-data = "auvexo_alpha.data_cli:main"

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "pytest==9.1.1",
  "hypothesis==6.169.4",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "httpx2==2.13.1",
  "pip-audit==2.10.1",
]
# The order-capable broker SDK is never part of the project's install requirements. Only
# the isolated read-only provider child imports it, through the verified loader (ADR-029);
# install it explicitly on Windows with `uv sync --locked --group provider`.
provider = [
  "metatrader5==5.0.6231; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "numpy==2.4.6; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv]
required-version = "==0.13.1"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "migrations", "tools"]
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/typings",
  "$MYPY_CONFIG_FILE_DIR/tools",
  "$MYPY_CONFIG_FILE_DIR/tests",
]
# Tools run as scripts (bare sibling imports) and as tools.* from tests; check the
# script form only, so each tool file has exactly one module name.
always_false = ["__package__"]

[[tool.mypy.overrides]]
# The synthetic PAPER fixtures two benchmark tools share with tests: typed, not a target.
module = ["paper_fixtures"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Hash-frozen by tests/test_paper_performance.py, so not editable. Its one finding is a
# reused "_" name (an int parameter, then a discarded str). Review date 2027-02-14.
module = ["benchmark_paper"]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["integration: requires an explicit real local PostgreSQL test database"]
filterwarnings = ["error"]

[tool.hatch.build.targets.wheel]
packages = ["src/auvexo_alpha"]
