[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "auvexo-alpha"
version = "0.1.0"
description = "Private local research foundation with execution disabled"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.2",
  "pydantic==2.14.1",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "polars==2.0.0",
]

[project.scripts]
auvexo = "auvexo_alpha.cli:main"
auvexo-data = "auvexo_alpha.data_cli:main"

[dependency-groups]
dev = [
  "hatchling==1.32.4",
  "pytest==9.1.1",
  "hypothesis==6.169.4",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "httpx2==2.13.1",
  "pip-audit==2.10.1",
  "psutil==7.2.2",
]

[tool.uv]
required-version = "==0.13.1"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["integration: requires an explicit real local PostgreSQL test database"]
filterwarnings = ["error"]

[tool.hatch.build.targets.wheel]
packages = ["src/auvexo_alpha"]
