name: foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories published after the last push are still seen.
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.1'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Scan the full reachable history for secrets with pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --no-banner --redact --exit-code 1
      - name: Start pinned isolated PostgreSQL on actual loopback endpoint
        run: |
          docker run --detach --name auvexo-ci-postgres --network host \
            --env POSTGRES_USER=auvexo_admin \
            --env POSTGRES_PASSWORD=ci-synthetic-ephemeral-only \
            --env POSTGRES_DB=auvexo_test \
            --env POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 \
            postgres -c listen_addresses=127.0.0.1 -c port=55432
          for attempt in $(seq 1 30); do
            if docker exec auvexo-ci-postgres pg_isready -h 127.0.0.1 -p 55432 -U auvexo_admin -d auvexo_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs auvexo-ci-postgres
          exit 1
      - run: uv sync --locked
      - run: uv run --frozen python tools/ci_database.py
      - run: uv run --frozen ruff format --check src tests tools migrations
      - run: uv run --frozen ruff check src tests tools migrations
      - run: uv run --frozen mypy
      - run: uv run --frozen python tools/run_tests.py
        env:
          TEST_PG_DATA_WRITER_PASSWORD: ci-synthetic-data-only-not-a-secret-123
          TEST_PG_ADMIN_PASSWORD: ci-synthetic-ephemeral-only
          TEST_PG_APP_PASSWORD: ci-synthetic-app-only-not-a-secret-123
      - run: node tools/check-docs.mjs
      - run: uv run --frozen python tools/secret_scan.py
      - run: uv export --frozen --all-groups --no-emit-project --output-file requirements-audit.txt
      - run: uv run --frozen pip-audit --disable-pip --require-hashes -r requirements-audit.txt
      - run: git diff --exit-code
      - run: npm ci --ignore-scripts --no-fund
        working-directory: web/operator-terminal
      - run: npm run typecheck
        working-directory: web/operator-terminal
      - run: npm run lint
        working-directory: web/operator-terminal
      - run: npm test
        working-directory: web/operator-terminal
      - run: npm run build
        working-directory: web/operator-terminal
      - run: npm audit --audit-level=high
        working-directory: web/operator-terminal
      - run: git diff --exit-code
      - name: Remove isolated PostgreSQL container
        if: always()
        run: docker rm --force auvexo-ci-postgres
  windows-native:
    # The only production platform. Runs the native proofs that the Linux job must skip
    # (DPAPI, ACLs, Job Objects, process identity, exact provider package) and audits the
    # Windows-only pins. PostgreSQL-backed tests stay in the Linux job.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      # The provider binding refuses hard-linked or byte-compiled package files, so the
      # environment must be installed by copy, as the provider runtime itself must be.
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --frozen mypy
      - run: uv run --frozen python tools/run_tests.py -m "not integration"
      - run: uv run --frozen pip-audit --disable-pip --require-hashes -r requirements-audit.txt
      - run: git diff --exit-code
